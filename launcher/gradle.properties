org.gradle.jvmargs=-Xmx768M
org.gradle.daemon=false

group_id=dev.nexus
launcher_version=1.2.5

# --- Updates -------------------------------------------------------------------------------------------
# GitHub repository with releases, e.g. myname/nexus-launcher. The launcher then reads
#   https://github.com/<repo>/releases/latest/download/nexus-update.json
# Leave empty to disable update checks (a user can still enter an address in Settings).
update_github_repo=qwercheka-byte/nexusCLIENT
# Alternative to GitHub: full address of nexus-update.json on your own hosting. Wins over update_github_repo.
update_url=
javafx_version=21.0.12
gson_version=2.14.0
