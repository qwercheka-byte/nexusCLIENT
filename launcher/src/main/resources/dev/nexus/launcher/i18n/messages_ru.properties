accounts.noClientId.title=Нужен Client ID приложения Azure
accounts.noClientId.text=Для входа через Microsoft лаунчер должен быть зарегистрирован как приложение в Microsoft Azure, а Mojang должна одобрить это приложение для доступа к API Minecraft. У NEXUS Launcher нет общего одобренного Client ID, поэтому его нужно указать в настройках.\n\n1. Зарегистрируйте приложение на portal.azure.com (тип учётных записей: «личные учётные записи Microsoft»), включите «Allow public client flows».\n2. Отправьте Client ID на проверку Mojang через форму aka.ms/mce-reviewappid.\n3. После одобрения вставьте Client ID в Настройки → Microsoft.\n\nДо одобрения вход завершится ошибкой «Invalid app registration». Офлайн-профиль работает без этого.
