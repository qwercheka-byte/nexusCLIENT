doctor.faq=Частые вопросы
doctor.faqSub=Короткие ответы на типичные беды сборок
faq.q1=Сколько памяти выделить сборке?
faq.a1=Ванила — 2 ГБ, до 30 модов — 3 ГБ, 30–80 модов — 4 ГБ, большие сборки (100+ модов) — 6–8 ГБ. Больше не значит лучше: избыток памяти мешает системе и может дать лаги GC.
faq.q2=Где мне найти ошибку запуска?
faq.a2=Вкладка «Консоль» прямо после вылета показывает последние строки. А кнопка «Проверить сборку» выше сама читает лог и объясняет типовые ошибки по-русски.
faq.q3=OptiFine или Sodium?
faq.a3=Под Fabric — Sodium (+ Iris для шейдеров): быстрее и стабильнее. OptiFine с Fabric на новых версиях плохо совместим и конфликтует с Sodium/Lithium — кнопка «Оптимизация» на вкладке «Моды» ставит проверенный набор в один клик.
faq.q4=Ресурс-пак не появляется в игре
faq.a4=Файл должен лежать именно в папке resourcepacks (кнопка на странице «Ресурс-паки»), zip распаковывать не нужно. Красный текст в игре значит, что пак сделан под другую версию.
faq.q5=Большая сборка грузится вечно и лагает
faq.a5=Поставьте память 6–8 ГБ, набор «Оптимизация» с Sodium/Lithium/C2ME, и дважды проверьте, что модов нет дубликатов — «Проверить сборку» поймает и то, и другое.

