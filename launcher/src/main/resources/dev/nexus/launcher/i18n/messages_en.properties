doctor.faq=FAQ
doctor.faqSub=Quick answers to typical build troubles
faq.q1=How much memory should a build get?
faq.a1=Vanilla — 2 GB, up to 30 mods — 3 GB, 30–80 mods — 4 GB, big packs (100+ mods) — 6–8 GB. More isn't better: excess RAM starves the system and can cause GC stutter.
faq.q2=Where do I find the launch error?
faq.a2=The Console tab shows the log right after a crash. And "Check build" above reads the log itself and explains common failures in plain words.
faq.q3=OptiFine or Sodium?
faq.a3=On Fabric — Sodium (+ Iris for shaders): faster and stabler. OptiFine conflicts with Sodium/Lithium — the "Optimise" button on the Mods tab installs the verified set in one click.
faq.q4=A resource pack doesn't show up in game
faq.a4=The file must sit directly in resourcepacks (button on the Resource Packs page). Don't unzip it. Red text in game means the pack targets another version.
faq.q5=My big pack loads forever and lags
faq.a5=Give it 6–8 GB of RAM, run the Optimise set with Sodium/Lithium/C2ME, and run "Check build" — duplicated mods and wrong RAM are the usual suspects.

